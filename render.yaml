services:
  # ============================================================================
  # 1. DJANGO BACKEND API SERVICE
  # ============================================================================
  - type: web
    name: equb-backend
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "./build.sh"
    startCommand: "gunicorn --chdir backend equb_core.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: USE_LOCAL_DB
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: equb-postgres
          property: connectionString
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_PUBLIC_KEY
        sync: false
      - key: CHAPA_WEBHOOK_SECRET
        sync: false
      - key: CHAPA_API_URL
        value: "https://api.chapa.co/v1"
      - key: CHAPA_SANDBOX_MODE
        value: "True"
      - key: FRONTEND_BASE_URL
        value: "https://equb-frontend.onrender.com"
      - key: BACKEND_BASE_URL
        value: "https://equb-backend.onrender.com"

  # ============================================================================
  # 2. VITE REACT FRONTEND STATIC SITE
  # ============================================================================
  - type: web
    name: equb-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        value: "https://equb-backend.onrender.com"

databases:
  # ============================================================================
  # 3. MANAGED POSTGRESQL DATABASE (FREE TIER)
  # ============================================================================
  - name: equb-postgres
    databaseName: digital_equb_db
    user: equb_admin
    region: frankfurt
    plan: free

